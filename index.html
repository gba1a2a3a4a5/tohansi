<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Gallery</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<!-- 第一页面：年龄确认 -->

<div id="agePage" class="page">


<div class="box">


<h1>
请确认你的年龄是否已满18岁
</h1>


<div>

<button id="adult">
是</button>


<button id="child">
否</button>


</div>


</div>


</div>





<!-- 第二页面：禁止访问 -->


<div id="blockedPage" class="page hide">


<div class="box">


<h1>
访问限制
</h1>


<p>
该网页已禁止你访问
</p>


</div>


</div>






<!-- 第三页面：加载 -->

<div id="loadingPage" class="page hide">


<div class="box">


<h2>
正在为你寻找与你年龄相适配的内容……
</h2>


<div class="progress">


<div></div>


</div>


<p id="loadingText">
正在搜索...
</p>


</div>


</div>







<!-- 第四页面：插画 -->

<div id="galleryPage" class="hide galleryPage">


<h1>
Illustration Gallery
</h1>



<div class="gallery">


<img src="images/1.jpg">
<img src="images/2.jpg">
<img src="images/3.jpg">
<img src="images/4.jpg">


<img src="images/5.jpg">
<img src="images/6.jpg">
<img src="images/7.jpg">
<img src="images/8.jpg">


<img src="images/9.jpg">
<img src="images/10.jpg">


</div>


</div>




<script src="script.js"></script>

</body>

</html>
